[workspace]
members = ["crates/runtime-core", "crates/runtime-native", "crates/runtime-python", "crates/runtime-test"]
default-members = ["crates/runtime-core", "crates/runtime-native", "crates/runtime-test"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"

[workspace.dependencies]
actorplane-core = { path = "crates/runtime-core" }
actorplane-native = { path = "crates/runtime-native" }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "time", "sync", "macros"] }
pyo3 = { version = "=0.29.2" }
